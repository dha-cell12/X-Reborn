name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
    - name: Download iOS SDK
      run: |
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/* $HOME/theos/sdks/
        
    - name: Install ldid (code signing tool)
      run: |
        brew install ldid
        
    - name: Build tweak (${{ matrix.scheme }})
      run: |
        make clean || true
        if [ "${{ matrix.scheme }}" == "rootless" ]; then
          export THEOS_PACKAGE_SCHEME=rootless
        fi
        make package FINALPACKAGE=1
        
    - name: Upload DEB artifact (${{ matrix.scheme }})
      uses: actions/upload-artifact@v4
      with:
        name: instancex-reborn-deb-${{ matrix.scheme }}
        path: packages/*.deb
        if-no-files-found: error
        
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.scheme }}
        path: |
          .theos/
          *.log
